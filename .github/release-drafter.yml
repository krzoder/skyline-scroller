name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
template: |
  ## Changes

  $CHANGES

  ---
  Full changelog: $PREVIOUS_TAG...v$RESOLVED_VERSION

categories:
  - title: 'Features'
    labels: [feature, enhancement]
  - title: 'Fixes'
    labels: [fix, bug]
  - title: 'Performance'
    labels: [perf, performance]
  - title: 'Refactors'
    labels: [refactor]
  - title: 'Docs and wiki'
    labels: [docs, wiki]
  - title: 'CI / build'
    labels: [ci, build, ops]
  - title: 'Dependencies'
    labels: [dependencies]
    collapse-after: 5

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'

# No AI attribution per user memory rule:
# - $AUTHOR resolves to the human committer login; release-drafter does not
#   inject co-authored-by trailers.
# - Do NOT add an "AI assistance" category or any line referencing Claude,
#   Copilot, etc.
exclude-labels:
  - skip-release-notes

version-resolver:
  major:
    labels: [major, breaking]
  minor:
    labels: [minor, feature]
  patch:
    labels: [patch, fix, bug, chore]
  default: patch

autolabeler:
  - label: ci
    files: ['.github/**']
  - label: docs
    files: ['wiki/**', '**/*.md']
  - label: feature
    title: ['/^feat(\(.*\))?:/i']
  - label: fix
    title: ['/^fix(\(.*\))?:/i']
  - label: refactor
    title: ['/^refactor(\(.*\))?:/i']
  - label: perf
    title: ['/^perf(\(.*\))?:/i']
