name: Deploy fidom.link

# Runs on the Deployarr self-hosted runner — same pattern as portfolio-web.
# No SSH key, no inbound ports, no GH secrets needed. The runner pulls jobs
# from GitHub via outbound 443 and writes directly to the local filesystem.

on:
  # Manual-only until a self-hosted runner is registered on Deployarr.
  # Once `gh runner list` shows the runner, re-enable the push trigger:
  #   push:
  #     branches: [main]
  #     paths-ignore: ['**.md', 'wiki/**', 'instructions/**']
  workflow_dispatch:

concurrency:
  group: deploy-fidom
  cancel-in-progress: true

permissions:
  contents: read

env:
  DIST_DIR: /mnt/homelab/apps/data/skyline-scroller/dist
  HEALTH_URL: http://127.0.0.1/health

jobs:
  build-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run build
        env:
          PUBLIC_BASE_PATH: /

      - name: Ensure target dir exists
        run: mkdir -p "${{ env.DIST_DIR }}"

      - name: Sync dist to nginx mount
        run: rsync -a --delete dist/ "${{ env.DIST_DIR }}/"

      - name: Smoke test (200 = public, 302 = redirect)
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "${{ env.HEALTH_URL }}" || true)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then exit 0; fi
            sleep 2
          done
          echo "Health check failed after 12s"
          exit 1
