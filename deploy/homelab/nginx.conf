server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check (used by docker healthcheck + CI smoke test)
    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Immutable hashed assets (Vite emits /assets/*-[hash].js etc).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every non-asset URL serves index.html.
    # Short cache so the shell updates promptly on each deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=60, must-revalidate";
    }

    # Transport-level security headers. App is public so no auth headers.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}
